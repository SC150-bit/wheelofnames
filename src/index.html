<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spin Selector</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="page-header">
      <h1>Spin Selector</h1>
      <p class="tagline">
        Load your roster, spin the wheel, celebrate the pick.
      </p>
    </header>

    <main class="layout">
      <section class="control-panel">
        <h2>Entries</h2>
        <form id="entry-form" class="entry-form">
          <label class="visually-hidden" for="entry-name">Add a name</label>
          <input
            id="entry-name"
            name="entryName"
            type="text"
            placeholder="Add a name"
            autocomplete="off"
          />
          <button type="submit">Add</button>
        </form>
        <ul id="entry-list" class="entry-list" aria-live="polite"></ul>
      </section>

      <section class="wheel-panel">
        <canvas
          id="wheel"
          width="520"
          height="520"
          aria-label="Random selection wheel"
        ></canvas>
        <button id="spin-btn" class="spin-btn">Spin</button>
        <p id="result" class="result" role="status" aria-live="polite"></p>
      </section>
    </main>

    <div id="probability-modal" class="modal hidden" aria-hidden="true">
      <div class="modal-backdrop" data-close="true"></div>
      <div
        class="modal-body"
        role="dialog"
        aria-modal="true"
        aria-labelledby="weights-title"
      >
        <header class="modal-header">
          <h2 id="weights-title">Options</h2>
          <button id="close-modal" type="button" class="plain-btn">
            Close
          </button>
        </header>
        <p class="modal-note">Configure entry preferences.</p>
        <form id="weight-form" class="weight-form">
          <div id="weight-fields" class="weight-fields"></div>
          <div class="modal-actions">
            <button type="submit" class="primary-btn">Apply</button>
          </div>
        </form>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
